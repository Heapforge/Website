baseURL = "https://heapforge.com/"
locale = "en-GB"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Heapforge"
enableRobotsTXT = true
enableGitInfo = false

# Nothing in this repo needs Hugo's taxonomy machinery.
disableKinds = ["taxonomy", "term", "rss"]

[languages]
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 1

    [[languages.en.menus.footer]]
      name = "Legal & Privacy"
      pageRef = "/legal"
      weight = 10

    [languages.en.params]
      tagline = "Software Studio in London & Sofia"
      description = "Heapforge is a software studio in London and Sofia building SaaS products, developer utilities, games, mobile apps and language-learning software."
      seoDescription = "Heapforge is a software studio based in London, UK and Sofia, Bulgaria. We build SaaS products, developer utilities, videogames, mobile apps and language-learning software."
      locations = ["Sofia, Bulgaria", "London, UK"]
      ogImageAlt = "Heapforge logo"

      [languages.en.params.organization]
        legalName = "Heapforge Ltd."
        description = "Heapforge Ltd. is a software development studio based in London, UK and Sofia, Bulgaria. It builds SaaS products, developer utilities, interactive videogames, mobile apps and language-learning software."
        sameAs = ["https://madladsquad.com", "https://tiny.lol", "https://lasso.domains"]
        foundingLocations = ["Sofia, Bulgaria", "London, United Kingdom"]

  [languages.bg]
    label = "Български"
    locale = "bg-BG"
    weight = 2

    [[languages.bg.menus.footer]]
      name = "Правна информация и поверителност"
      url = "/legal/"
      weight = 10

    [languages.bg.params]
      tagline = "Софтуерно студио в Лондон и София"
      description = "Heapforge е софтуерно студио в Лондон и София, което разработва SaaS продукти, инструменти за разработчици, игри, мобилни приложения и софтуер за изучаване на езици."
      seoDescription = "Heapforge е софтуерно студио, базирано в Лондон, Великобритания и София, България. Разработваме SaaS продукти, инструменти за разработчици, видеоигри, мобилни приложения и софтуер за изучаване на езици."
      locations = ["София, България", "Лондон, Великобритания"]
      ogImageAlt = "Лого на Heapforge"

      [languages.bg.params.organization]
        legalName = "Heapforge Ltd."
        description = "Heapforge Ltd. е студио за разработка на софтуер, базирано в Лондон, Великобритания и София, България. То създава SaaS продукти, инструменти за разработчици, интерактивни видеоигри, мобилни приложения и софтуер за изучаване на езици."
        sameAs = ["https://madladsquad.com", "https://tiny.lol", "https://lasso.domains"]
        foundingLocations = ["София, България", "Лондон, Обединено кралство"]

[params]
  tagline = "Software Studio in London & Sofia"
  description = "Heapforge is a software studio in London and Sofia building SaaS products, developer utilities, games, mobile apps and language-learning software."
  seoDescription = "Heapforge is a software studio based in London, UK and Sofia, Bulgaria. We build SaaS products, developer utilities, videogames, mobile apps and language-learning software."
  author = "Heapforge"
  themeColor = "#F3F0E8"
  colorScheme = "light dark"
  ogImage = "assets/favicon.svg"
  # Short, human-facing location labels (schema.org uses the formal names below).
  locations = ["Sofia, Bulgaria", "London, UK"]
  ogImageAlt = "Heapforge logo"
  copyrightStartYear = 2024

  # Fonts loaded from Google Fonts; referenced by the head partial.
  [params.fonts]
    href = "https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"

  [params.organization]
    # Registered company name; use for the footer and any legal-facing copy.
    legalName = "Heapforge Ltd."
    description = "Heapforge Ltd. is a software development studio based in London, UK and Sofia, Bulgaria. It builds SaaS products, developer utilities, interactive videogames, mobile apps and language-learning software."
    sameAs = ["https://madladsquad.com", "https://tiny.lol", "https://lasso.domains"]
    foundingLocations = ["Sofia, Bulgaria", "London, United Kingdom"]

  # Public contact address, shown in the footer and the JSON-LD.
  [params.contact]
    email = "contact@heapforge.com"

  # Company social profiles, rendered as icon links in the footer and added to
  # the JSON-LD sameAs. `icon` names a glyph in _partials/icons/icon.html.
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/company/heapforge-ltd"
    icon = "linkedin"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Heapforge"
    icon = "github"

  [params.openSource]
    name = "MadLadSquad"
    url = "https://madladsquad.com"
    label = "madladsquad.com"

  # RFC 9116 security.txt, rendered by layouts/home.security.txt. Expires is
  # computed at build time, so a rebuild is what keeps the file valid.
  [params.security]
    contact = "mailto:security@heapforge.com"
    preferredLanguages = ["en", "bg", "ro"]
    expiryMonths = 12

[outputs]
  home = ["html", "llms", "robots", "security"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"

  # Served from /.well-known/security.txt; not a document alternate, so it is
  # kept out of head/meta.html's rel="alternate" links.
  [outputFormats.security]
    mediaType = "text/plain"
    path = ".well-known"
    baseName = "security"
    isPlainText = true
    notAlternative = true

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 1.0

[build]
  writeStats = false

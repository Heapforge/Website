# Какво Heapforge изгражда за клиенти, визуализирано от sections/services.html и
# описано в llms.txt. `icon` е име на икона в assets/icons/.
offerings:
  - name: Уебсайтове
    icon: web-app
    summary: Бързи и достъпни уебсайтове, създадени за добро класиране в търсачките.

  - name: Уеб приложения и SaaS
    icon: dashboard
    summary: От първия прототип до жива среда – потребителски профили, разплащания, контролни панели и API интерфейси.

  - name: Мобилни приложения
    icon: mobile-app
    summary: Приложения за iOS и Android, които вършат работата си отлично и без излишни функционалности.

  - name: AI и автоматизация
    icon: ai-automation
    summary: Интегриране на изкуствен интелект, агенти и AI автоматизации, свързани с инструментите, които вече използвате.

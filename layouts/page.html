{{ define "main" }}
  {{ partial "page-head.html" (dict "page" .) }}

  <div class="container page-body page-body--article">
    {{ partial "toc.html" . }}

    <article class="prose">
      {{ .Content }}

      {{- with .Parent }}{{ if not .IsHome }}
      <p class="prose__back">
        <a class="link-arrow link-arrow--back" href="{{ .RelPermalink }}">{{ partial "icons/icon.html" (dict "name" "arrow-left" "size" 16) }} {{ i18n "back_to" (dict "title" .Title) }}</a>
      </p>
      {{- end }}{{ end }}
    </article>
  </div>
{{ end }}

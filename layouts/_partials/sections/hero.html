<section class="hero" aria-labelledby="hero-title" data-hero>
  <canvas class="hero__canvas" data-heat aria-hidden="true"></canvas>
  <div class="hero__scrim" aria-hidden="true"></div>
  <div class="hero__grain grain" aria-hidden="true"></div>

  <div class="hero__inner container">
    <h1 class="hero__title reveal-load" id="hero-title" style="--d: 0">
      <span class="hero__line">{{ i18n "hero_title_line1" | safeHTML }}</span>
      <span class="hero__line">{{ i18n "hero_title_line2" }}</span>
    </h1>
    <p class="hero__lede reveal-load" style="--d: 1">
      {{ i18n "hero_lede" }}
    </p>

    <div class="hero__meta reveal-load" style="--d: 2">
      <a class="button button--primary" href="#projects">
        {{ i18n "hero_cta_primary" }} {{ partial "icons/icon.html" (dict "name" "arrow-right" "size" 18) }}
      </a>
      {{- if site.Params.contact.email }}
      <a class="button button--ghost" href="#contact">{{ i18n "hero_cta_secondary" }}</a>
      {{- end }}
    </div>
  </div>
</section>

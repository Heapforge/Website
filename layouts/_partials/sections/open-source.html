{{- with site.Params.openSource }}
<section class="section section--band" id="open-source" aria-labelledby="open-source-title">
  <div class="band">
    <div class="band__heat" aria-hidden="true"></div>
    <div class="band__grain grain" aria-hidden="true"></div>
    <div class="container band__inner">
      <h2 class="band__title" id="open-source-title">
        {{ i18n "open_source_title" (dict "name" (printf `<span class="band__name">%s</span>` .name)) | safeHTML }}
      </h2>
      <div class="band__foot">
        <p class="band__copy">{{ i18n "open_source_copy" }}</p>
        <a class="button button--light" href="{{ .url }}" target="_blank" rel="noopener">
          {{ .label }} {{ partial "icons/icon.html" (dict "name" "arrow-up-right" "size" 18) }}<span class="visually-hidden"> {{ i18n "opens_new_tab" }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
{{- end }}

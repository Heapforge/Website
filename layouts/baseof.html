<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>

</head>
<body class="page page--{{ .Kind }}">

  {{ partial "header.html" . }}

  <main id="main" tabindex="-1">

  {{ partial "footer.html" . }}

  {{ partial "scripts.html" . }}
</body>
</html>
